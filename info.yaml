# Tiny Tapeout project information
project:
  title:        "NTT Single Butterfly Accelerator"
  author:       "Nguyen Tuan Minh"
  discord:      ""
  description:  "NTT Single Butterfly Hardware Accelerator for Sky130"
  language:     "Verilog"
  clock_hz:     75000000                 # Tần số 75 MHz

  # Khai báo khung kích thước 2x2
  tiles:        "2x2"

  # Tên module top wrapper
  top_module:   "tt_um_ntt_top_single"

  # Danh sách file nguồn Verilog trong thư mục src/
  source_files:
    - "tt_um_ntt_top_single.v"
    - "mod_add_sub_div2.v"
    - "mod_multiplier.v"
    - "twiddle_rom.v"
    - "single_butterfly.v"
    - "ntt_addr_gen.v"
    - "ntt_fsm_rom.v"
    - "ntt_top.v"
    - "ntt_mem.v"

# Pinout mapping (có thể để trống hoặc điền mô tả chân)
pinout:
  ui[0]: "start"
  ui[1]: "sel_byte"
  ui[2]: ""
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  uo[0]: "data_out_lsb/done"
  uo[1]: "data_out[1]"
  uo[2]: "data_out[2]"
  uo[3]: "data_out[3]"
  uo[4]: "data_out[4]"
  uo[5]: "data_out[5]"
  uo[6]: "data_out[6]"
  uo[7]: "data_out[7]"
